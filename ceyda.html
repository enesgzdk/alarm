<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WakeUp OS | Ceyda Komuta Paneli</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Bildirim Toast Alanı -->
  <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col space-y-2 pointer-events-none w-full max-w-xs px-4"></div>

  <!-- 1. KİLİT EKRANI (Sadece Ceyda'nın Face ID'si Açar) -->
  <div id="lockScreen" class="w-full max-w-md bg-[#161f30] border border-gray-800 rounded-3xl p-8 shadow-2xl text-center space-y-6">
    <div class="w-20 h-20 bg-rose-950/40 border border-rose-800/40 rounded-full flex items-center justify-center mx-auto text-3xl">
      👑
    </div>
    <div>
      <h2 class="text-xl font-bold text-white">Ceyda Root Paneli</h2>
      <p class="text-xs text-gray-400 mt-1">Bu sistem yalnızca Ceyda'nın kayıtlı Face ID biyometrik anahtarıyla yönetilebilir.</p>
    </div>

    <div class="space-y-3 pt-2">
      <button id="btnUnlock" onclick="unlockWithFaceID()" class="w-full py-4 bg-gradient-to-r from-rose-600 to-indigo-600 hover:from-rose-500 hover:to-indigo-500 font-bold rounded-2xl text-white shadow-xl shadow-rose-950/40 flex items-center justify-center space-x-2 transition active:scale-95">
        <span>🛡️</span>
        <span>Face ID ile Giriş Yap</span>
      </button>

      <button id="btnRegister" onclick="registerCeydaDevice()" class="text-xs text-rose-400 hover:text-rose-300 underline py-2 block mx-auto">
        İlk Kurulum: Bu Cihazı Ceyda'nın Face ID'si ile Eşle
      </button>
    </div>
  </div>

  <!-- 2. ROOT KONTROL PANELİ (Doğrulama Sonrası Aktif) -->
  <div id="mainPanel" class="hidden w-full max-w-md bg-[#161f30] border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-6">
    
    <!-- Başlık & Batarya Durumu -->
    <div class="flex justify-between items-center pb-4 border-b border-gray-800">
      <div>
        <div class="flex items-center space-x-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-emerald-400 text-xs font-semibold">Root Yetkisi: Ceyda</span>
        </div>
        <h1 class="text-lg font-bold tracking-tight text-white mt-0.5">Enes Uyandırma Kontrolü</h1>
      </div>
      
      <div class="flex items-center space-x-2 bg-gray-900/60 px-3 py-1.5 rounded-full border border-gray-700">
        <span id="chargeIcon" class="hidden text-amber-400 text-xs font-bold">⚡</span>
        <span id="batteryText" class="text-xs font-semibold text-emerald-400">--%</span>
        <div class="w-6 h-3 border border-gray-400 rounded-sm p-0.5 flex items-center">
          <div id="batteryBar" class="h-full bg-emerald-400 rounded-2xs" style="width: 50%;"></div>
        </div>
      </div>
    </div>

    <!-- Anlık Dürtme Butonu (Tek Tıkla Titret) -->
    <div class="bg-gradient-to-r from-rose-950/40 to-pink-950/30 border border-rose-900/40 rounded-2xl p-5 text-center space-y-3">
      <div class="text-left">
        <h3 class="text-sm font-bold text-rose-300">💥 Enes'i Dürt (Anlık Titret)</h3>
        <p class="text-xs text-rose-400/80">Butona dokunduğun an göğsüne 3 saniyelik sert titreşim ve çakar flaş darbesi vurur.</p>
      </div>
      <button onclick="triggerNudge()" class="w-full py-4 bg-rose-600 hover:bg-rose-500 active:scale-[0.98] transition font-extrabold rounded-xl text-white shadow-lg shadow-rose-900/50 text-base">
        ŞİMDİ DÜRT (UYANDIR)
      </button>
    </div>

    <!-- Alarm Saati Ayarı (Saat Seçici Formatı) -->
    <div class="bg-gray-900/40 border border-gray-800 rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <span class="text-sm font-medium text-gray-300">Alarm Durumu</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="alarmToggle" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
        </label>
      </div>

      <!-- Saat Seçici (Geçersiz format girişini engeller) -->
      <div class="flex justify-center py-2">
        <input type="time" id="timePicker" class="bg-gray-800/80 border border-gray-700 text-center text-4xl font-mono font-bold text-white rounded-2xl px-6 py-3 tracking-widest focus:outline-none focus:border-indigo-500 shadow-inner">
      </div>

      <button type="button" onclick="saveAlarmSettings()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] transition font-semibold rounded-xl text-sm shadow-md shadow-indigo-950/40">
        Alarm Saatini Güncelle
      </button>
    </div>

    <!-- Acil Alarm Susturma / Kapatma -->
    <div class="bg-gray-900/40 border border-gray-800 rounded-2xl p-4 text-center">
      <button type="button" onclick="stopAlarmSystem()" class="w-full py-3 bg-red-600/80 hover:bg-red-600 active:scale-[0.98] font-bold rounded-xl text-xs uppercase tracking-wider text-white transition">
        🛑 Çalan Alarmı Kapat / Sustur
      </button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygdawhsdhffrzssxogn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5Z2Rhd2hzZGhmZnJ6c3N4b2duIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDc3NjgsImV4cCI6MjEwOTEyMzc2OH0.cBWYfR_6BzxoI5Vo8kH45vpo-YPu3yRxRIlwv_wsvgA";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Toast Bildirim Fonksiyonu
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const isSuccess = type === 'success';
      const bgBorder = isSuccess ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/90 border-rose-500/50 text-rose-200';
      const icon = isSuccess ? '✓' : '✕';

      toast.className = `flex items-center space-x-3 px-4 py-3 rounded-2xl border backdrop-blur-md shadow-xl text-xs font-medium transition-all duration-300 transform -translate-y-4 opacity-0 pointer-events-auto ${bgBorder}`;
      toast.innerHTML = `<span class="font-bold text-sm">${icon}</span><span>${message}</span>`;
      
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('-translate-y-4', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // --- WEBAUTHN (CEYDA FACE ID MOTORU) ---
    async function registerCeydaDevice() {
      if (!window.PublicKeyCredential) {
        showToast("Cihazınız WebAuthn/Face ID desteklemiyor.", "error");
        return;
      }

      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const createCredentialOptions = {
          publicKey: {
            challenge: challenge,
            rp: { name: "WakeUp OS" },
            user: {
              id: Uint8Array.from("CEYDA_MASTER_KEY", c => c.charCodeAt(0)),
              name: "ceyda",
              displayName: "Ceyda"
            },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            authenticatorSelection: {
              authenticatorAttachment: "platform",
              userVerification: "required"
            },
            timeout: 60000
          }
        };

        const credential = await navigator.credentials.create(createCredentialOptions);
        if (credential) {
          localStorage.setItem('ceyda_auth_id', credential.id);
          showToast("Harika! Bu telefon Ceyda'nın Face ID'si ile eşlendi.");
          document.getElementById('btnRegister').classList.add('hidden');
          unlockWithFaceID();
        }
      } catch (err) {
        showToast("Eşleme iptal edildi: " + err.message, "error");
      }
    }

    async function unlockWithFaceID() {
      const credId = localStorage.getItem('ceyda_auth_id');
      if (!credId) {
        showToast("Lütfen önce cihazı Face ID ile eşleyin.", "error");
        return;
      }

      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const assertion = await navigator.credentials.get({
          publicKey: { 
            challenge, 
            userVerification: "required", 
            timeout: 60000 
          }
        });

        if (assertion) {
          document.getElementById('lockScreen').classList.add('hidden');
          document.getElementById('mainPanel').classList.remove('hidden');
          showToast("Hoş geldin Ceyda! Root paneli açıldı.");
          loadState();
          setInterval(loadState, 15000);
        }
      } catch (err) {
        showToast("Face ID doğrulanamadı!", "error");
      }
    }

    // --- SUPABASE ETKİLEŞİMLERİ ---
    async function loadState() {
      try {
        const { data, error } = await supabaseClient.from('alarm_state').select('*').eq('id', 1).single();
        if (error) {
          console.error("Supabase yükleme hatası:", error);
          return;
        }
        if (data) {
          const h = String(data.alarm_hour).padStart(2, '0');
          const m = String(data.alarm_minute).padStart(2, '0');
          document.getElementById('timePicker').value = `${h}:${m}`;
          document.getElementById('alarmToggle').checked = data.alarm_enabled;
          
          const batt = data.battery_level ?? 100;
          document.getElementById('batteryText').innerText = `%${batt}`;
          document.getElementById('batteryBar').style.width = `${batt}%`;
          
          if (data.is_charging) {
            document.getElementById('chargeIcon').classList.remove('hidden');
          } else {
            document.getElementById('chargeIcon').classList.add('hidden');
          }
        }
      } catch (err) {
        console.error("Beklenmeyen hata:", err);
      }
    }

    async function triggerNudge() {
      const { error } = await supabaseClient.from('alarm_state').update({ vibrate_now: true }).eq('id', 1);
      if (!error) {
        showToast("Titreşim emri gönderildi! Enes titriyor.");
      } else {
        showToast("Hata: " + error.message, "error");
      }
    }

    async function saveAlarmSettings() {
      const timeVal = document.getElementById('timePicker').value;
      if (!timeVal) {
        showToast("Lütfen geçerli bir saat seçin.", "error");
        return;
      }

      const [h, m] = timeVal.split(':').map(n => parseInt(n, 10));
      const enabled = document.getElementById('alarmToggle').checked;

      const { error } = await supabaseClient.from('alarm_state').update({
        alarm_hour: h,
        alarm_minute: m,
        alarm_enabled: enabled
      }).eq('id', 1);

      if (!error) {
        showToast(`Alarm saati ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} olarak güncellendi!`);
      } else {
        showToast("Güncelleme hatası: " + error.message, "error");
      }
    }

    async function stopAlarmSystem() {
      const { error } = await supabaseClient.from('alarm_state').update({ 
        alarm_enabled: false,
        is_ringing: false 
      }).eq('id', 1);
      
      if (!error) {
        document.getElementById('alarmToggle').checked = false;
        showToast("Alarm tamamen kapatıldı ve susturuldu.");
      } else {
        showToast("Susturma hatası: " + error.message, "error");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('ceyda_auth_id')) {
        document.getElementById('btnRegister').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
