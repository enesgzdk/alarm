<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WakeUp OS | Enes Kontrol Paneli</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Toast Bildirim Alanı -->
  <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col space-y-2 pointer-events-none w-full max-w-xs px-4"></div>

  <div class="w-full max-w-md bg-[#161f30] border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-6">
    
    <!-- Başlık & Batarya -->
    <div class="flex justify-between items-center pb-4 border-b border-gray-800">
      <div>
        <h1 class="text-lg font-bold text-white">WakeUp System</h1>
        <p class="text-xs text-gray-400">Enes Kullanıcı Paneli</p>
      </div>
      
      <div class="flex items-center space-x-2 bg-gray-900/60 px-3 py-1.5 rounded-full border border-gray-700">
        <span id="chargeIcon" class="hidden text-amber-400 text-xs font-bold">⚡</span>
        <span id="batteryText" class="text-xs font-semibold text-emerald-400">--%</span>
        <div class="w-6 h-3 border border-gray-400 rounded-sm p-0.5 flex items-center">
          <div id="batteryBar" class="h-full bg-emerald-400 rounded-2xs" style="width: 50%;"></div>
        </div>
      </div>
    </div>

    <!-- Alarm Çalma Durumu Uyarısı -->
    <div id="ringingBanner" class="hidden bg-rose-950/60 border border-rose-600/60 rounded-2xl p-4 text-center space-y-2 animate-pulse">
      <div class="text-2xl">🚨</div>
      <h3 class="text-sm font-bold text-rose-300">ALARM ÇALIYOR!</h3>
      <p class="text-xs text-rose-200">Susturmak için salondaki NFC noktasına gidip Face ID okutmanız gerekiyor.</p>
    </div>

    <!-- Alarm Saati Kurulumu -->
    <div class="bg-gray-900/40 border border-gray-800 rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <span class="text-sm font-medium text-gray-300">Alarm Durumu</span>
        <span id="alarmStatusBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-800 text-gray-400">Yükleniyor...</span>
      </div>

      <div class="flex justify-center py-1">
        <input type="time" id="timePicker" class="bg-gray-800/80 border border-gray-700 text-center text-4xl font-mono font-bold text-white rounded-2xl px-6 py-3 tracking-widest focus:outline-none focus:border-indigo-500 shadow-inner">
      </div>

      <button type="button" onclick="saveAlarmTime()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] transition font-semibold rounded-xl text-sm shadow-md shadow-indigo-950/40">
        Alarm Saatini Kur / Güncelle
      </button>
    </div>

    <!-- Biyometrik Cihaz Tanımlama -->
    <div class="bg-gray-900/30 border border-gray-800/80 rounded-2xl p-4 space-y-3">
      <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Cihaz Doğrulama Durumu</h4>
      
      <div class="space-y-2">
        <button id="btnEnesRegister" type="button" onclick="registerEnesDevice()" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 font-semibold rounded-xl text-xs text-gray-200 flex items-center justify-center space-x-2 transition">
          <span>👤</span>
          <span id="enesBioLabel">Bu Cihazı Enes Olarak Supabase'e Eşle</span>
        </button>

        <a href="ceyda.html" class="block w-full text-center py-2.5 bg-rose-950/40 hover:bg-rose-900/40 border border-rose-800/30 font-semibold rounded-xl text-xs text-rose-300 transition">
          👑 Ceyda Root Paneline Geç
        </a>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygdawhsdhffrzssxogn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5Z2Rhd2hzZGhmZnJ6c3N4b2duIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDc3NjgsImV4cCI6MjEwOTEyMzc2OH0.cBWYfR_6BzxoI5Vo8kH45vpo-YPu3yRxRIlwv_wsvgA";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const isSuccess = type === 'success';
      const bg = isSuccess ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/90 border-rose-500/50 text-rose-200';
      toast.className = `flex items-center space-x-3 px-4 py-3 rounded-2xl border backdrop-blur-md shadow-xl text-xs font-medium transition-all duration-300 transform -translate-y-4 opacity-0 pointer-events-auto ${bg}`;
      toast.innerHTML = `<span class="font-bold text-sm">${isSuccess ? '✓' : '✕'}</span><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('-translate-y-4', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function bufferToBase64(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)));
    }

    async function registerEnesDevice() {
      if (!window.PublicKeyCredential) {
        showToast("Cihazınız WebAuthn/Face ID desteklemiyor.", "error");
        return;
      }
      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const credential = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: "WakeUp OS" },
            user: {
              id: Uint8Array.from("ENES_MASTER", c => c.charCodeAt(0)),
              name: "enes",
              displayName: "Enes"
            },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000
          }
        });

        if (credential) {
          const rawIdBase64 = bufferToBase64(credential.rawId);
          const { error } = await supabaseClient.from('auth_keys').upsert({
            user_name: 'enes',
            credential_id: rawIdBase64
          });

          if (!error) {
            showToast("Harika! Cihazınız Enes olarak Supabase'e mühürlendi.");
            checkEnesAuth();
          } else {
            showToast("Kayıt hatası: " + error.message, "error");
          }
        }
      } catch (err) {
        showToast("Eşleme başarısız: " + err.message, "error");
      }
    }

    async function checkEnesAuth() {
      const { data } = await supabaseClient.from('auth_keys').select('credential_id').eq('user_name', 'enes').single();
      if (data) {
        document.getElementById('enesBioLabel').innerText = "Enes Cihazı Tanımlı ✓";
        document.getElementById('btnEnesRegister').classList.add('opacity-70', 'cursor-default');
      }
    }

    async function loadState() {
      const { data } = await supabaseClient.from('alarm_state').select('*').eq('id', 1).single();
      if (data) {
        const h = String(data.alarm_hour).padStart(2, '0');
        const m = String(data.alarm_minute).padStart(2, '0');
        document.getElementById('timePicker').value = `${h}:${m}`;
        
        const badge = document.getElementById('alarmStatusBadge');
        if (data.alarm_enabled) {
          badge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/40";
          badge.innerText = "Aktif";
        } else {
          badge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-800 text-gray-400";
          badge.innerText = "Kapalı";
        }

        if (data.is_ringing) {
          document.getElementById('ringingBanner').classList.remove('hidden');
        } else {
          document.getElementById('ringingBanner').classList.add('hidden');
        }

        const batt = data.battery_level ?? 100;
        document.getElementById('batteryText').innerText = `%${batt}`;
        document.getElementById('batteryBar').style.width = `${batt}%`;
        
        if (data.is_charging) {
          document.getElementById('chargeIcon').classList.remove('hidden');
        } else {
          document.getElementById('chargeIcon').classList.add('hidden');
        }
      }
    }

    async function saveAlarmTime() {
      const timeVal = document.getElementById('timePicker').value;
      if (!timeVal) return showToast("Geçerli bir saat seçiniz.", "error");

      const [h, m] = timeVal.split(':').map(n => parseInt(n, 10));
      const { error } = await supabaseClient.from('alarm_state').update({
        alarm_hour: h,
        alarm_minute: m,
        alarm_enabled: true
      }).eq('id', 1);

      if (!error) {
        showToast(`Alarm ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} olarak güncellendi!`);
        loadState();
      } else {
        showToast("Hata: " + error.message, "error");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkEnesAuth();
      loadState();
      setInterval(loadState, 10000);
    });
  </script>
</body>
</html>
